name: Generate Snake Animation

on:
  # Runs automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows manual trigger from Actions tab
  workflow_dispatch:
  
  # Runs on push to main branch
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: write
    
    steps:
      - name: Generate Snake Animation (Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hariprakash0804
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=00E5FF&color_dots=#0A1020,#182B4A,#243B73,#5B4BC4,#9D7CFF
      
      - name: Generate Snake Animation (Light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hariprakash0804
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=7C3AED&color_dots=#F5F7FF,#D9E1FF,#B8C7FF,#8B7CFF,#6B4EFF
      
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
