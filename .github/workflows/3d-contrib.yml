name: GitHub-Profile-3D-Contrib
on:
  schedule:
    - cron: "0 18 * * *"   # runs daily at 18:00 UTC (11:30 PM IST)
  workflow_dispatch:        # allow manual trigger from Actions tab
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - name: Write settings JSON to file
        run: |
          cat > settings.json << 'EOF'
          {
            "githubUserName": "hariprakash0804",
            "type": "GitHubSVG",
            "title": "Hariprakash A — Contribution Grid",
            "topLangs": 5,
            "utcOffset": "+05:30",
            "locationInfo": {
              "lat": 11.6643,
              "lon": 78.1460
            }
          }
          EOF

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: hariprakash0804
          MAX_REPOS: 10
          SETTING_JSON: settings.json

      - name: Commit & push the generated SVGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "chore: regenerate 3D contribution grid [skip ci]"
          git push
