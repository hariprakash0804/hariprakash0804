name: GitHub-Profile-3D-Contrib
on:
  schedule:
    - cron: "0 18 * * *"   # runs daily at 18:00 UTC (11:30 PM IST)
  workflow_dispatch:        # allow manual trigger from Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'profile-3d-contrib/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: hariprakash0804
          MAX_REPOS: 10

      - name: Apply Cyberpunk Neon Styling to 3D Contrib Grid
        run: |
          python scripts/style-3d-contrib.py

      - name: Commit & push the generated SVGs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile-3d-contrib/
          git diff --staged --quiet || git commit -m "chore: regenerate and style 3D contribution grid [skip ci]"
          git push
