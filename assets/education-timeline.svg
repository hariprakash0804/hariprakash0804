<svg width="900" height="160" viewBox="0 0 900 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes node-pulse {
        0%, 100% { r: 8; fill-opacity: 0.8; }
        50% { r: 11; fill-opacity: 1; }
      }
      @keyframes ring-expand {
        0% { r: 8; opacity: 0.8; }
        100% { r: 22; opacity: 0; }
      }
      @keyframes line-draw {
        0% { stroke-dashoffset: 700; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes text-fade {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes progress-fill {
        0% { width: 0; }
        100% { width: 100%; }
      }
      .timeline-node {
        animation: node-pulse 2.5s ease-in-out infinite;
      }
      .timeline-node-d1 { animation-delay: 0.4s; }
      .timeline-node-d2 { animation-delay: 0.8s; }
      .timeline-node-d3 { animation-delay: 1.2s; }
      .timeline-ring {
        animation: ring-expand 2.5s ease-out infinite;
      }
      .timeline-ring-d1 { animation-delay: 0.4s; }
      .timeline-ring-d2 { animation-delay: 0.8s; }
      .timeline-ring-d3 { animation-delay: 1.2s; }
      .timeline-path {
        stroke-dasharray: 700;
        animation: line-draw 3s ease-out forwards;
      }
      .year-text {
        animation: text-fade 3s ease-in-out infinite;
      }
    </style>
    <linearGradient id="tl-bg" x1="0" y1="0" x2="900" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#0d0820"/>
    </linearGradient>
    <linearGradient id="tl-line" x1="100" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF"/>
      <stop offset="0.33" stop-color="#7C3AED"/>
      <stop offset="0.66" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <pattern id="tl-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" stroke="#38BDF8" stroke-opacity="0.03" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" rx="14" fill="url(#tl-bg)"/>
  <rect width="900" height="160" rx="14" fill="url(#tl-grid)"/>
  <rect x="1" y="1" width="898" height="158" rx="13" fill="none" stroke="#1E293B" stroke-opacity="0.3"/>

  <!-- Timeline line -->
  <line x1="100" y1="70" x2="800" y2="70" stroke="url(#tl-line)" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="100" y1="70" x2="800" y2="70" stroke="url(#tl-line)" stroke-width="1.5" class="timeline-path"/>

  <!-- 2022 Node - Start -->
  <g transform="translate(100, 70)">
    <circle cx="0" cy="0" r="8" fill="#00E5FF" class="timeline-node"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#00E5FF" class="timeline-ring"/>
    <text x="0" y="-22" fill="#00E5FF" font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" class="year-text">2022</text>
    <text x="0" y="26" fill="#CBD5E1" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">B.Tech IT</text>
    <text x="0" y="40" fill="#64748B" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">KSR IET</text>
  </g>

  <!-- 2023 Node -->
  <g transform="translate(333, 70)">
    <circle cx="0" cy="0" r="8" fill="#7C3AED" class="timeline-node timeline-node-d1"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#7C3AED" class="timeline-ring timeline-ring-d1"/>
    <text x="0" y="-22" fill="#7C3AED" font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" class="year-text">2023</text>
    <text x="0" y="26" fill="#CBD5E1" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">DSA · OOP · DBMS</text>
    <text x="0" y="40" fill="#64748B" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Foundations</text>
  </g>

  <!-- 2024 Node -->
  <g transform="translate(566, 70)">
    <circle cx="0" cy="0" r="8" fill="#EC4899" class="timeline-node timeline-node-d2"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#EC4899" class="timeline-ring timeline-ring-d2"/>
    <text x="0" y="-22" fill="#EC4899" font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" class="year-text">2024</text>
    <text x="0" y="26" fill="#CBD5E1" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">IoT · ML · Web</text>
    <text x="0" y="40" fill="#64748B" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Specialization</text>
  </g>

  <!-- 2026 Node - End -->
  <g transform="translate(800, 70)">
    <circle cx="0" cy="0" r="8" fill="#22C55E" class="timeline-node timeline-node-d3"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#22C55E" class="timeline-ring timeline-ring-d3"/>
    <text x="0" y="-22" fill="#22C55E" font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" class="year-text">2026</text>
    <text x="0" y="26" fill="#CBD5E1" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">DEPLOY NEXT</text>
    <text x="0" y="40" fill="#64748B" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">Graduation</text>
  </g>

  <!-- Minor label -->
  <text x="450" y="130" fill="#94A3B8" font-family="'Courier New', monospace" font-size="11" text-anchor="middle" letter-spacing="2">MINOR: SENSOR TECHNOLOGIES &amp; IoT</text>
  <text x="450" y="148" fill="#64748B" font-family="'Courier New', monospace" font-size="10" text-anchor="middle" letter-spacing="1">CORE: DSA · OOP · DBMS · WEB · IoT · EMBEDDED · ML</text>
</svg>
