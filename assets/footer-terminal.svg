<svg width="900" height="140" viewBox="0 0 900 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes terminal-blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scanline-ft {
        0% { transform: translateY(-140px); }
        100% { transform: translateY(140px); }
      }
      @keyframes text-reveal {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes border-scan {
        0% { stroke-dashoffset: 2080; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes glitch-shift {
        0%, 90%, 100% { transform: translateX(0); }
        92% { transform: translateX(-2px); }
        94% { transform: translateX(2px); }
        96% { transform: translateX(-1px); }
        98% { transform: translateX(1px); }
      }
      .cursor-ft {
        animation: terminal-blink 1s step-end infinite;
      }
      .scanline-ft {
        animation: scanline-ft 5s linear infinite;
      }
      .reveal-1 { animation: text-reveal 0.5s ease-out forwards; }
      .reveal-2 { animation: text-reveal 0.5s ease-out 0.3s forwards; opacity: 0; }
      .reveal-3 { animation: text-reveal 0.5s ease-out 0.6s forwards; opacity: 0; }
      .reveal-4 { animation: text-reveal 0.5s ease-out 0.9s forwards; opacity: 0; }
      .reveal-5 { animation: text-reveal 0.5s ease-out 1.2s forwards; opacity: 0; }
      .border-draw {
        stroke-dasharray: 2080;
        animation: border-scan 3s ease-out forwards;
      }
      .glitch-name {
        animation: glitch-shift 5s linear infinite;
      }
    </style>
    <linearGradient id="ft-bg" x1="0" y1="0" x2="900" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050510"/>
      <stop offset="1" stop-color="#0a0820"/>
    </linearGradient>
    <linearGradient id="ft-border" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#7C3AED" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="ft-scanline" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ft-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" stroke="#38BDF8" stroke-opacity="0.03" stroke-width="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="140" rx="14" fill="url(#ft-bg)"/>
  <rect width="900" height="140" rx="14" fill="url(#ft-grid)"/>
  <rect x="1" y="1" width="898" height="138" rx="13" fill="none" stroke="url(#ft-border)" class="border-draw"/>

  <!-- Scanline -->
  <rect x="0" y="0" width="900" height="40" fill="url(#ft-scanline)" class="scanline-ft"/>

  <!-- Terminal window dots -->
  <circle cx="28" cy="20" r="4" fill="#FF5F57"/>
  <circle cx="44" cy="20" r="4" fill="#FEBC2E"/>
  <circle cx="60" cy="20" r="4" fill="#28C840"/>

  <!-- Terminal header -->
  <text x="80" y="24" fill="#64748B" font-family="'Courier New', monospace" font-size="11" letter-spacing="2">hariprakash@system:~$</text>

  <!-- Terminal lines -->
  <g font-family="'Courier New', monospace" font-size="13">
    <text x="28" y="50" fill="#00E5FF" class="reveal-1">
      <tspan fill="#64748B">$</tspan> echo "Build relentlessly. Verify everything. Keep learning."
    </text>
    <text x="28" y="72" fill="#CBD5E1" class="reveal-2">Build relentlessly. Verify everything. Keep learning.</text>
    <text x="28" y="94" fill="#00E5FF" class="reveal-3">
      <tspan fill="#64748B">$</tspan> echo "Let's build something useful."
    </text>
    <text x="28" y="116" fill="#22C55E" class="reveal-4">Vanakkam 👋 from Tamil Nadu, India.</text>
    <text x="28" y="132" fill="#64748B" class="reveal-5">
      <tspan fill="#64748B">$</tspan>
      <tspan fill="#F8FAFC" class="cursor-ft">█</tspan>
    </text>
  </g>

  <!-- Signature -->
  <text x="870" y="132" fill="#334155" font-family="'Courier New', monospace" font-size="9" text-anchor="end" class="glitch-name">HARI-0804</text>
</svg>
